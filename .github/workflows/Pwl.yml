name: Repair Minecraft 26.3 Data JSON

on:
  push:
    branches:
      - The-solar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-minecraft-26.3-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout The-solar
        uses: actions/checkout@v4
        with:
          ref: The-solar

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Repair 26.3 recipe and advancement JSON
        run: bash .github/scripts/a.sh

      - name: Check patch formatting
        run: git diff --check

      - name: Commit repaired data files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/resources/data .github/scripts/fix-minecraft-26.3-data.sh .github/workflows/repair-minecraft-26.3-data.yml
            git commit -m "Fix Minecraft 26.3 data JSON formats"
            git push origin HEAD:The-solar
          else
            echo "No data JSON repairs were needed."
          fi
