
name: Repair Minecraft 26.3 Data JSON

on:
  push:
    branches:
      - The-solar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-minecraft-26.3-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout The-solar
        uses: actions/checkout@v4
        with:
          ref: The-solar

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Repair Minecraft 26.3 recipe and advancement JSON
        shell: bash
        run: |
          set -euo pipefail

          DATA_DIR="src/main/resources/data"

          if [[ ! -d "$DATA_DIR" ]]; then
            echo "ERROR: $DATA_DIR not found."
            exit 1
          fi

          changed=0

          # Repair recipe ingredient formats
          while IFS= read -r -d '' file; do
            tmp="${file}.tmp"

            jq 'walk(
              if type == "object"
                 and (keys == ["item"])
                 and (.item | type == "string")
              then .item
              else . end
            )' "$file" > "$tmp"

            if ! cmp -s "$file" "$tmp"; then
              mv "$tmp" "$file"
              echo "Fixed recipe: $file"
              changed=$((changed + 1))
            else
              rm -f "$tmp"
            fi
          done < <(find "$DATA_DIR" -type f -path '*/recipe/*.json' -print0)

          # Repair killed-entity advancement predicates
          while IFS= read -r -d '' file; do
            tmp="${file}.tmp"

            jq '
              if (.criteria | type) == "object" then
                .criteria |= with_entries(
                  .value |= (
                    if .trigger == "minecraft:player_killed_entity"
                       and (.conditions.entity | type) == "object"
                       and ((.conditions.entity | keys) == ["type"])
                       and (.conditions.entity.type | type) == "string"
                    then
                      .conditions.entity as $entity
                      | .conditions.entity = {
                          "type": "minecraft:entity_properties",
                          "entity": "this",
                          "predicate": $entity
                        }
                    else . end
                  )
                )
              else . end
            ' "$file" > "$tmp"

            if ! cmp -s "$file" "$tmp"; then
              mv "$tmp" "$file"
              echo "Fixed advancement: $file"
              changed=$((changed + 1))
            else
              rm -f "$tmp"
            fi
          done < <(find "$DATA_DIR" -type f -path '*/advancement/*.json' -print0)

          # Validate all JSON files
          echo "Validating all data JSON files..."

          while IFS= read -r -d '' file; do
            jq -e . "$file" > /dev/null
            echo "Valid: $file"
          done < <(find "$DATA_DIR" -type f -name '*.json' -print0)

          echo "Changed files: $changed"
          echo "JSON validation completed successfully."

      - name: Check patch formatting
        run: git diff --check

      - name: Commit repaired data files
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add src/main/resources/data
            git add .github/workflows/repair-minecraft-26.3-data.yml

            git commit -m "Fix Minecraft 26.3 data JSON formats"

            git push origin HEAD:The-solar
          else
            echo "No data JSON repairs were needed."
          fi
