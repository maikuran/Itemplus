
name: Fix Solar Biome Spawn Registries

on:
  push:
    branches:
      - The-solar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solar-biome-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-biome-spawns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout The-solar
        uses: actions/checkout@v4
        with:
          ref: The-solar
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Restore correct Minecraft 26.3 spawn format
        shell: bash
        run: |
          set -euo pipefail

          BIOME_DIR="src/main/resources/data/thesolar/worldgen/biome"

          if [ ! -d "$BIOME_DIR" ]; then
            echo "ERROR: Biome directory not found"
            exit 1
          fi

          fixed=0

          while IFS= read -r -d '' file; do
            tmp="${file}.tmp"

            jq '
              if (
                .attributes["minecraft:gameplay/natural_mob_spawns"]
                .argument.spawns_by_category
              ) then
                .attributes["minecraft:gameplay/natural_mob_spawns"]
                .argument.spawns_by_category |=
                with_entries(
                  .value |= map(
                    if has("data") then
                      (.data + {"weight": .weight})
                    else
                      .
                    end
                  )
                )
              else
                .
              end
            ' "$file" > "$tmp"

            jq empty "$tmp"
            mv "$tmp" "$file"

            echo "RESTORED: $file"
            fixed=$((fixed + 1))

          done < <(
            find "$BIOME_DIR" -maxdepth 1 -type f -name '*.json' -print0
          )

          echo "Processed: $fixed biome files"

      - name: Validate JSON and spawn entries
        shell: bash
        run: |
          set -euo pipefail

          BIOME_DIR="src/main/resources/data/thesolar/worldgen/biome"

          while IFS= read -r -d '' file; do
            jq -e '
              [
                .attributes["minecraft:gameplay/natural_mob_spawns"]
                .argument.spawns_by_category // {}
                | .[]?[]
                | select(
                    has("data")
                    or ((.type | type) != "string")
                    or (.count == null)
                    or ((.weight | type) != "number")
                  )
              ] | length == 0
            ' "$file" >/dev/null

            echo "VALID: $file"

          done < <(
            find "$BIOME_DIR" -maxdepth 1 -type f -name '*.json' -print0
          )

          echo "All biome spawn entries are valid."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/thesolar/worldgen/biome/

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "Fix Minecraft 26.3 biome spawn format [skip ci]"
          git push origin HEAD:The-solar

          echo "Successfully updated The-solar."
