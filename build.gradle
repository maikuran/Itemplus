plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
}

group = 'com.sakalti.sakaplus'
version = '1.0.6'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    mappings "net.fabricmc:yarn:26.3+build.1:v2"

    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.166.0+26.3"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations.all {
    resolutionStrategy {
        force 'io.netty:netty-transport-native-epoll:4.1.82.Final'
    }
}

jar {
    manifest {
        attributes(
            'Fabric-Loom-Version': '1.19-SNAPSHOT',
            'Main-Class': 'com.sakalti.sakaplus.SakaplusMod2'
        )
    }
}
